<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F8F4F9"/>
            <stop offset="50%" stop-color="#F0E5F2"/>
            <stop offset="100%" stop-color="#EBE0EE"/>
        </linearGradient>
        <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9B3F8F" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#C94B5C" stop-opacity="0.5"/>
        </linearGradient>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#35124F" flood-opacity="0.06"/>
        </filter>
    </defs>
    
    <!-- Background Canvas -->
    <rect width="800" height="600" fill="url(#bgGrad)"/>
    
    <!-- Subtle Pattern / Grid -->
    <g opacity="0.15" stroke="#35124F" stroke-width="1" stroke-dasharray="6,6">
        <line x1="0" y1="150" x2="800" y2="150"/>
        <line x1="0" y1="300" x2="800" y2="300"/>
        <line x1="0" y1="450" x2="800" y2="450"/>
        <line x1="200" y1="0" x2="200" y2="600"/>
        <line x1="400" y1="0" x2="400" y2="600"/>
        <line x1="600" y1="0" x2="600" y2="600"/>
    </g>

    <!-- Inner Card Container -->
    <rect x="180" y="140" width="440" height="320" rx="20" fill="#FFFFFF" opacity="0.65" filter="url(#softGlow)"/>
    <rect x="180" y="140" width="440" height="320" rx="20" fill="none" stroke="url(#iconGrad)" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.7"/>

    <!-- Placeholder Graphic Icon -->
    <g transform="translate(400, 270)" text-anchor="middle">
        <!-- Rounded Photo Icon Frame -->
        <rect x="-42" y="-45" width="84" height="66" rx="10" fill="none" stroke="url(#iconGrad)" stroke-width="3" stroke-linecap="round"/>
        <!-- Mountain / Sun Symbol inside icon -->
        <circle cx="16" cy="-24" r="7" fill="url(#iconGrad)"/>
        <path d="M -30 11 L -6 -18 L 12 3 L 24 -11 L 34 11 Z" fill="url(#iconGrad)"/>
        
        <!-- Text Label -->
        <text y="58" font-family="'Montserrat', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#6E5577" text-transform="uppercase">
            Product Preview
        </text>
        <text y="78" font-family="'Montserrat', 'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="500" letter-spacing="1.5" fill="#9F8DA7">
            Image Coming Soon
        </text>
    </g>
</svg>
